    <nav class="bg-[#89A482] border-b border-slate-700 ">
        <div class="max-w-7xl mx-auto px-2 py-3 flex justify-between items-center gap-6">
            <div>

                <p class="font-bold text-[30px] text-white">Woke<span

            </div >

            <div class="bg-white rounded-full flex items-center px-5 py-3 w-full max-w-md">
                <span class="text-gray-400 mr-3">⌕</span>

                <input id="btnRecherche" bg-[#F6E7A6] type="text" placeholder="Rechercher un livre..."
                    class="w-full outline-none text-gray-700 text-sm">
            </div>
        </div>
    </nav>
    <!-- Hero Section -->
    <section class="bg-[#89A482] text-white">

        <div class="max-w-7xl mx-auto px-8 py-16 grid md:grid-cols-2 gap-12 items-center">

            <div>
                <p class=" text-xs font-bold tracking-widest mb-10 text-[#F6E7A6]">REVUE PEDAROGIQUE </p>
                <h2 class="heading text-4xl md:text-5xl font-bold  mb-10">Activité <span
                        class=" text-[#F6E7A6]">pedarogique</span> en classe</h2>
                <p class=" text-sm mb-10">
                    Activité permet de dynamiser le groupe, de mobiliser <br>
                    ses connaissances ou de découvrir une notion de manière ludique.
                </p>

                <div class="flex gap-3 flex-wrap">

                    <button id="btnTous"
                        class="border border-slate-500 text-black bg-[#F6E7A6] px-5 py-2 tous rounded-full text-sm " data-type ="tous" atr="true">Tous</button>
                    <button id="btnJeux"
                        class="border border-slate-500 bg-white text-black px-5 py-2 tous rounded-full text-sm hover:bg-[#5C7057]" data-type ="jeu" atr="false">Jeu</button>
                    <button id="btnApprentissage"
                        class="border border-slate-500 bg-white text-black px-5 py-2 tous rounded-full text-sm hover:bg-[#5C7057]" data-type ="apprentissage" atr="false">Apprentissage</button>
                    <button id="btnExercice"
                        class="border border-slate-500 bg-white text-black px-5 py-2 tous rounded-full text-sm hover:bg-[#5C7057]" data-type ="exercice" atr="false">Exercice</button>
                    <button id="btnAutre"
                        class="border border-slate-500 bg-white text-black px-5 py-2 tous rounded-full text-sm hover:bg-[#5C7057]" data-type ="autre" atr="false">Autre</button>

                </div>

            </div>

        </div>
    </section>
    <div class="flex justify-end px-4 py-8">
        <button id="btnForm" class="  bg-teal-300 px-4 py-2 rounded-full hover:bg-teal-400">+ Ajouter une activité
        </button>
    </div>

    <div id="formAjoute" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center ">

        <form id="formActivite" class="flex flex-col gap-5 p-5 rounded-xl bg-white w-[40%] h-[55%]">
            <h2 class="font-bold text-lg">Nouvelle activité</h2>

            <input type="text" id="titre" placeholder="Titre" required class="border px-3 py-2 rounded">
            <select id="theme" type="text" required class="border px-2 py-2 rounded ">
                <option value="" selected disabled>Theme</option>
                <option value="jeux">Jeux</option>
                <option value="apprentissage">Apprentissage</option>
                <option value="exercice">Exercice</option>
                <option value="autre">Autre</option>
            </select>
            <input type="text" id="duree" placeholder="Durée (min)" required class="border px-3 py-2 rounded">
            <input id="objectifs" placeholder="Objectif d'activité" class="border px-3 py-2 rounded">
            <input id="description" placeholder="Description d'activité" class="border px-3 py-2 rounded">


            <div class="flex justify-end gap-3">
                <button type="button" id="btnAnnuler" class="border px-4 py-2 rounded-full">Annuler</button>
                <button type="submit" id="btnAjouter" class="bg-teal-300 px-4 py-2 rounded-full">Ajouter</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
